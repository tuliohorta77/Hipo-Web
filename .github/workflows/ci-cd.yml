name: Knotty CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─── JOB 1: TESTES DA API ─────────────────────────────────────────────────
  test-api:
    name: Testes API (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install fastapi uvicorn python-jose[cryptography] bcrypt \
                      pandas pytest httpx pytest-cov python-dotenv requests

      - name: Rodar testes
        env:
          KNOTTY_SECRET_KEY: chave-de-teste-ci
        run: pytest api/tests/ -v --tb=short --cov=api --cov-report=term-missing

  # ─── JOB 2: BUILD DO FRONTEND ─────────────────────────────────────────────
  build-web:
    name: Build Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: knotty-web/package-lock.json

      - name: Instalar dependências
        working-directory: knotty-web
        run: npm ci

      - name: Build de produção
        working-directory: knotty-web
        run: npm run build

      - name: Verificar tamanho do bundle
        working-directory: knotty-web
        run: |
          echo "=== Tamanho do build ==="
          du -sh dist/
          du -sh dist/assets/*

      - name: Salvar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: knotty-web-dist
          path: knotty-web/dist/
          retention-days: 3

  # ─── JOB 3: DEPLOY PRODUÇÃO (só no push para main) ───────────────────────
  deploy-producao:
    name: Deploy Produção (EC2)
    runs-on: ubuntu-latest
    needs: [test-api, build-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: knotty-web-dist
          path: knotty-web/dist/

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/knotty.pem
          chmod 600 ~/.ssh/knotty.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Deploy frontend → EC2
        run: |
          scp -i ~/.ssh/knotty.pem -r knotty-web/dist/* \
            ec2-user@${{ secrets.EC2_HOST_PROD }}:/var/www/knotty/

      - name: Corrigir permissões e recarregar nginx
        run: |
          ssh -i ~/.ssh/knotty.pem ec2-user@${{ secrets.EC2_HOST_PROD }} "
            chmod -R 755 /var/www/knotty &&
            chmod 644 /var/www/knotty/index.html &&
            find /var/www/knotty/assets -type f -exec chmod 644 {} \; &&
            sudo systemctl reload nginx &&
            echo 'Frontend OK'
          "

      - name: Deploy API → EC2
        run: |
          scp -i ~/.ssh/knotty.pem -r api/ \
            ec2-user@${{ secrets.EC2_HOST_PROD }}:/home/ec2-user/app-omie-financeiro/

      - name: Reiniciar API e health check
        run: |
          ssh -i ~/.ssh/knotty.pem ec2-user@${{ secrets.EC2_HOST_PROD }} "
            sudo systemctl restart knotty-api &&
            sleep 3 &&
            curl -sf http://localhost:8000/health && echo 'API OK' || echo 'API FALHOU'
          "
