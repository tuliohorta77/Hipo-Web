# HIPO -- instancia MOS (entrega 046). /etc/nginx/conf.d/hipo-mos.conf
#
# So HTTP: a fase tls do instalador roda o certbot --nginx, que acrescenta
# o bloco 443 e o redirecionamento neste mesmo arquivo.
#
# Mesmo desenho do hipo.conf da base principal: o SPA na raiz e a API
# atras de /api/, com o prefixo cortado pelo proxy_pass com barra final.
server {
    listen 80;
    server_name mos.hipogestao.com.br;

    root /var/www/hipo-mos;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}
